name: Daily Genshin Check-in

on:
  schedule:
    # 17:00 UTC = 00:00 WIB
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily check-in
        id: checkin
        continue-on-error: true
        run: npm run daily-checkin
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GENSHIN_ACCOUNTS: ${{ secrets.GENSHIN_ACCOUNTS }}

      - name: Commit log
        if: always()
        run: |
          if [ -n "$(git status --porcelain log.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add log.txt
            git commit -m "Update check-in log"
            git push
          fi

      - name: Fail job if check-in failed
        if: steps.checkin.outcome == 'failure'
        run: exit 1
