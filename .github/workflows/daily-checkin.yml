name: Daily Genshin Check-in

on:
  schedule:
    # 17:00 UTC = 00:00 WIB
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily check-in
        id: checkin
        continue-on-error: true
        run: npm run daily-checkin
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GENSHIN_ACCOUNTS: ${{ secrets.GENSHIN_ACCOUNTS }}
          GENSHIN_ACCOUNTS_1_LTOKEN: ${{ secrets.GENSHIN_ACCOUNTS_1_LTOKEN }}
          GENSHIN_ACCOUNTS_2_LTOKEN: ${{ secrets.GENSHIN_ACCOUNTS_2_LTOKEN }}
